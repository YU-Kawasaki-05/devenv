<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} · Thinking Space</title>
<meta name="description" content="{{SUMMARY}}">
<link rel="stylesheet" href="../../assets/theme.css">
</head>
<body>
<div class="progress"></div>
<button class="theme-toggle" aria-label="テーマ切替">☾</button>

<!-- HERO ─────────────────────────────────────────────────── -->
<header class="wrap hero">
  <p class="eyebrow">{{EYEBROW}}</p>   <!-- 例: 意思決定レビュー · Decision-Grade -->
  <h1>{{TITLE}}</h1>
  <p class="lede">{{LEDE}}</p>          <!-- 1〜2文。<strong> で核を太字に -->

  <div class="meta-row">
    <span>{{DATE}}</span><span class="dot"></span>
    <span>{{PROCESS}}</span><span class="dot"></span>
    <span>確信度 {{CONFIDENCE}}</span>
  </div>

  <!-- 結論バッジ: go(緑)/warn(黄)/kill(赤)/neutral。判定の要点を 1〜3 個 -->
  <div class="verdicts">
    <span class="vbadge vbadge--go"><span class="tag">{{TAG}}</span>{{LABEL}}</span>
  </div>
</header>

<div class="doc">
  <!-- TOC: 各 section の id と対応させる（PCのみ表示・追従ハイライト） -->
  <nav class="toc" aria-label="目次">
    <p class="toc__label">目次</p>
    <a href="#easy">はじめに</a>
    <a href="#verdict">結論</a>
    <!-- TODO: セクションぶん追加 -->
  </nav>

  <main>
    <!-- 0. やさしい要約（初心者向け・専門用語なし。必須） -->
    <section id="easy" class="section" style="padding-top:1rem">
      <div class="prose">
        <div class="easy">
          <span class="easy__label">◍ 5分で分かる（専門用語なし）</span>
          <h3>{{EASY_HEADING}}</h3>
          <p>{{EASY_PARAGRAPH}}</p>
        </div>
      </div>
    </section>

    <!-- 1. 結論 -->
    <section id="verdict" class="section">
      <div class="prose">
        <span class="section__num">01 — VERDICT</span>
        <h2 class="section-head">結論</h2>
        <div class="plain"><b>かみくだくと</b><span>{{PLAIN_RESTATEMENT}}</span></div>
        <p>{{BODY}}</p>
        <div class="callout">
          <p class="callout__label">最重要の理由</p>
          <p>{{KEY_REASON}}</p>
        </div>
      </div>
    </section>

    <!-- TODO: 中身のセクションを references/components.md のパターンで追加
         （資産分解 / 選択肢の表 / 候補カード / ステークホルダー表 /
          タイムライン / 検証計画 / 次の一手 / 用語集 / 出典 など） -->

    <footer class="prose foot">
      <p><a class="backlink" href="../../index.html">← Thinking Space に戻る</a></p>
      <p>{{FOOTER_NOTE}}</p>
    </footer>
  </main>
</div>

<script src="../../assets/app.js"></script>
</body>
</html>
