# devenv project → profile mapping.
# scripts/sync.sh and scripts/diff.sh resolve the profile from this file
# (key = basename of the project directory).
#
# Conventions:
#   <name>: <profile>          — managed project (synced from templates/<profile>/)
#   # <name>: pending          — managed in future, blocked on something noted below
#   # <name>: out of scope     — intentionally excluded; document the reason
#
# Projects in ~/marubo_ai (outside ~/develop/) are still resolvable here because
# lookup uses the basename, not the full path.

projects:
  # --- managed (in sync) ---
  Ardors-website: docs-first-web
  schedule_app: docs-first-web

  # --- managed with project-specific overrides ---
  lifeapp: docs-first-web        # overrides/lifeapp/ keeps category-1 files
  marubo_ai: docs-first-web      # overrides/marubo_ai/ keeps the project-specific CLAUDE.md
  slide-gen: slide-kit           # overrides/slide-gen/BUILD.md carries PPTX-specific build/structure
  slide-web: slide-kit           # overrides/slide-web/BUILD.md carries Slidev/HTML-specific build/structure
  slide-web-new: slide-kit-reveal   # new reveal.js-based HTML slide skill; successor to slide-web

  # --- pending: B (will be managed once conditions are met) ---
  # jovin: docs-first-web        # CLAUDE.md is empty (0 lines) — re-evaluate when project takes shape

  # --- out of scope: C (intentionally not managed) ---
  # job-hunt                               — single-project profile; git-managed directly. devenv overhead > value. removed 2026-06-23.
  # evs-AI-basedTestSpecificationCreation  — separate large multi-subproject system; doesn't fit docs-first-web profile
  # univ                                   — personal academic notes; not an app project
  # marubo_forPractice                     — sandbox/practice repo
  # NoovaInc/erevista-ocr                  — different client/case, mostly empty for now
